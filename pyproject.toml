[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beginner-file-integrity-monitor"
version = "1.0.0"
description = "A beginner-friendly SHA-256 file integrity monitor written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "File Integrity Monitor contributors"}]
dependencies = []
keywords = ["cybersecurity", "file-integrity", "sha256", "python", "monitoring"]

[project.scripts]
fim = "fim_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["fim_monitor*"]
